name: Unzip
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -q m3e-canvas-updated.zip
          rsync -a --exclude .github m3e-canvas-main/ ./
          rm -rf m3e-canvas-main m3e-canvas-updated.zip
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Apply update" || echo "nothing to commit"
          git push
